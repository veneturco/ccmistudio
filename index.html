    <script>
      // En entorno de desarrollo o vista previa en iframe, limpiar ServiceWorker para evitar colisión de caché
      if ('serviceWorker' in navigator) {
        var isLocalOrDev = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' || 
                           window.location.hostname.includes('.run.app');
        if (isLocalOrDev) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.unregister();
            }
          }).catch(function() {});
          if (typeof caches !== 'undefined') {
            caches.keys().then(function(names) {
              for (var name of names) {
                caches.delete(name);
              }
            }).catch(function() {});
          }
        } else if (window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      }
    </script>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ccmi_user_settings_v2') || localStorage.getItem('ccmi_user_settings_v1');
          var pref = null;
          var theme = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            pref = parsed.preference;
            theme = parsed.theme;
          }
          var resolvedTheme = 'dark';
          // PRIORIDAD A LA SELECCIÓN MANUAL:
          if (pref === 'clinical_light' || (!pref && theme === 'clinical_light')) {
            resolvedTheme = 'clinical_light';
          } else if (pref === 'dark' || (!pref && theme === 'dark')) {
            resolvedTheme = 'dark';
          } else {
            // Opción 1: Horario Automático (07:00 a 18:30)
            var now = new Date();
            var mins = now.getHours() * 60 + now.getMinutes();
            if (mins >= 420 && mins < 1110) {
              resolvedTheme = 'clinical_light';
            } else {
              resolvedTheme = 'dark';
            }
          }
          if (resolvedTheme === 'clinical_light') {
            document.documentElement.classList.add('theme-clinical-light');
            document.documentElement.classList.remove('theme-dark');
            document.documentElement.setAttribute('data-theme', 'clinical-light');
          } else {
            document.documentElement.classList.add('theme-dark');
            document.documentElement.classList.remove('theme-clinical-light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
